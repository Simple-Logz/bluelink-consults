<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a3d"/>
      <stop offset="1" stop-color="#050b2d"/>
    </linearGradient>
    <linearGradient id="goBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17834a"/>
      <stop offset="1" stop-color="#20a35d"/>
    </linearGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000018" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="url(#bg2)"/>
  <circle cx="1080" cy="150" r="200" fill="#ffffff" opacity="0.04"/>
  <circle cx="90" cy="760" r="220" fill="#17834a" opacity="0.10"/>

  <!-- main dashboard card -->
  <g filter="url(#soft2)">
    <rect x="140" y="150" width="920" height="430" rx="16" fill="#fbfaf8"/>
    <rect x="140" y="150" width="920" height="56" rx="16" fill="#eef0f4"/>
    <circle cx="176" cy="178" r="7" fill="#e2665a"/>
    <circle cx="200" cy="178" r="7" fill="#e6b95c"/>
    <circle cx="224" cy="178" r="7" fill="#63b672"/>
    <rect x="260" y="166" width="230" height="22" rx="6" fill="#050b2d"/>
    <rect x="880" y="164" width="140" height="28" rx="14" fill="#eaf6ee"/>
    <rect x="900" y="172" width="100" height="12" rx="6" fill="#17834a"/>

    <!-- pipeline stages -->
    <line x1="220" y1="330" x2="980" y2="330" stroke="#d8dee8" stroke-width="4"/>
    <g>
      <circle cx="220" cy="330" r="34" fill="#eaf0ff"/>
      <rect x="203" y="313" width="34" height="34" rx="6" fill="#2563eb"/>
      <rect x="176" y="356" width="90" height="14" rx="4" fill="#050b2d"/>
      <rect x="186" y="378" width="70" height="10" rx="4" fill="#8b93a3"/>
    </g>
    <g>
      <circle cx="480" cy="330" r="34" fill="#eaf0ff"/>
      <rect x="463" y="313" width="34" height="34" rx="6" fill="#a95e21"/>
      <rect x="430" y="356" width="100" height="14" rx="4" fill="#050b2d"/>
      <rect x="440" y="378" width="80" height="10" rx="4" fill="#8b93a3"/>
    </g>
    <g>
      <circle cx="720" cy="330" r="34" fill="#eaf6ee"/>
      <path d="M704 330 l12 12 l24 -26" stroke="#17834a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="668" y="356" width="110" height="14" rx="4" fill="#050b2d"/>
      <rect x="678" y="378" width="90" height="10" rx="4" fill="#8b93a3"/>
    </g>
    <g>
      <circle cx="960" cy="330" r="34" fill="#fbf1e2"/>
      <path d="M960 316 v28 M948 328 l12 -12 l12 12" stroke="#a95e21" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="908" y="356" width="104" height="14" rx="4" fill="#050b2d"/>
      <rect x="918" y="378" width="84" height="10" rx="4" fill="#8b93a3"/>
    </g>

    <!-- checklist panel -->
    <rect x="176" y="430" width="868" height="110" rx="10" fill="#f4f0eb"/>
    <g>
      <circle cx="210" cy="462" r="11" fill="#17834a"/>
      <path d="M204 462 l4 4 l9 -10" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="232" y="455" width="150" height="14" rx="4" fill="#050b2d"/>
    </g>
    <g>
      <circle cx="210" cy="500" r="11" fill="#17834a"/>
      <path d="M204 500 l4 4 l9 -10" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="232" y="493" width="190" height="14" rx="4" fill="#050b2d"/>
    </g>
    <g>
      <circle cx="600" cy="462" r="11" fill="#17834a"/>
      <path d="M594 462 l4 4 l9 -10" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="622" y="455" width="170" height="14" rx="4" fill="#050b2d"/>
    </g>
    <g>
      <circle cx="600" cy="500" r="11" fill="#17834a"/>
      <path d="M594 500 l4 4 l9 -10" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="622" y="493" width="140" height="14" rx="4" fill="#050b2d"/>
    </g>
  </g>

  <!-- floating go/no-go badge -->
  <g filter="url(#soft2)">
    <rect x="760" y="640" width="320" height="150" rx="16" fill="#050b2d"/>
    <circle cx="820" cy="700" r="30" fill="url(#goBtn)"/>
    <path d="M806 700 l10 10 l20 -22" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="864" y="682" width="180" height="16" rx="4" fill="#ffffff"/>
    <rect x="864" y="708" width="140" height="12" rx="4" fill="#8b93a3"/>
  </g>

  <!-- small warning-caught chip -->
  <g filter="url(#soft2)">
    <rect x="150" y="660" width="330" height="130" rx="14" fill="#fbfaf8"/>
    <circle cx="200" cy="700" r="20" fill="#fbf1e2"/>
    <rect x="192" y="690" width="16" height="16" rx="3" fill="#a95e21"/>
    <rect x="232" y="686" width="220" height="14" rx="4" fill="#050b2d"/>
    <rect x="232" y="710" width="180" height="10" rx="4" fill="#8b93a3"/>
    <rect x="192" y="740" width="260" height="26" rx="13" fill="#f4f0eb"/>
    <rect x="206" y="748" width="150" height="10" rx="4" fill="#5d687d"/>
  </g>
</svg>
